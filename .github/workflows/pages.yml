name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Use GitHub Actions as the Pages source
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: site } = await github.request('GET /repos/{owner}/{repo}/pages', { owner, repo });
            if (site.build_type !== 'workflow') {
              try {
                await github.request('PUT /repos/{owner}/{repo}/pages', {
                  owner, repo, build_type: 'workflow'
                });
              } catch (error) {
                if (error.status !== 403) throw error;
                core.warning('Set Settings > Pages > Build and deployment > Source to GitHub Actions. The workflow token cannot change this repository setting.');
              }
            }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
